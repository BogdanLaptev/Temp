<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Я тебя люблю ❤️</title>
<style>
:root{--pink:#ff174f;--hot:#ff3f73;--deep:#070008}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep)}
body{font-family:Arial,sans-serif;cursor:default}
#scene{position:fixed;inset:0;overflow:hidden;background:#050006}
#bg{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;filter:saturate(1.25) contrast(1.12);transform:scale(1.03);opacity:.92}
#glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 58%,rgba(255,0,70,.25),transparent 32%),radial-gradient(circle at 50% 55%,rgba(255,20,100,.10),transparent 58%);pointer-events:none}
#canvas{position:absolute;inset:0;width:100%;height:100%;z-index:5}
#dust{position:absolute;inset:0;z-index:6;pointer-events:none}
.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#ff3c71;box-shadow:0 0 8px #ff174f;opacity:.55}
#textLayer{position:absolute;left:50%;top:54%;z-index:18;opacity:0;transform:translate(-50%,-50%) scale(.82);pointer-events:none;mix-blend-mode:screen}
#textLayer img{display:block;width:min(440px,42vw);height:auto;filter:drop-shadow(0 0 14px rgba(255,20,80,.9)) drop-shadow(0 0 34px rgba(255,20,80,.55))}
#textLayer.show{animation:textIn 1.55s cubic-bezier(.16,1,.3,1) forwards}
#textLayer.hide{animation:textOut .75s ease forwards}
@keyframes textIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.58)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes textOut{to{opacity:0;transform:translate(-50%,-50%) scale(1.28)}}
#pugs{position:absolute;inset:0;z-index:14;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
#pugs.on{opacity:1}
.pug{position:absolute;left:0;top:0;will-change:transform;opacity:0;filter:drop-shadow(0 13px 12px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(255,40,100,.20));transform-origin:center;transition:opacity 1s ease}
.pug.visible{opacity:1}
.pug img{display:block;width:100%;height:100%;object-fit:contain}
#hearts{position:absolute;inset:0;z-index:16;pointer-events:none;opacity:0;transition:opacity 1s}
#hearts.on{opacity:1}
.float-heart{position:absolute;color:#ff3b70;text-shadow:0 0 8px #ff174f,0 0 20px #ff174f;animation:floatHeart linear infinite}
@keyframes floatHeart{0%{transform:translate3d(0,110vh,0) scale(.55) rotate(-15deg);opacity:0}12%{opacity:.9}85%{opacity:.65}100%{transform:translate3d(var(--drift),-120px,0) scale(1.1) rotate(18deg);opacity:0}}
#vignette{position:absolute;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle at 50% 53%,transparent 25%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.82) 100%)}
#flash{position:absolute;inset:0;z-index:28;background:#ff174f;opacity:0;pointer-events:none}
#flash.burst{animation:burst .7s ease-out forwards}
@keyframes burst{0%{opacity:.30}100%{opacity:0}}
@media(max-width:700px){#textLayer img{width:min(360px,72vw)}.pug{max-width:120px;max-height:120px}}
</style>
</head>
<body>
<div id="scene">
  <img id="bg" src="assets/space-bg.jpg" alt="">
  <div id="glow"></div>
  <canvas id="canvas"></canvas>
  <div id="dust"></div>
  <div id="textLayer"><img src="assets/love-text.png" alt="Я тебя люблю"></div>
  <div id="hearts"></div>
  <div id="pugs"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const textLayer=document.getElementById('textLayer');
const pugLayer=document.getElementById('pugs');
const hearts=document.getElementById('hearts');
const flash=document.getElementById('flash');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function rnd(a,b){return Math.random()*(b-a)+a}
function heartPoint(t){return{x:16*Math.sin(t)**3,y:13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)}}
let particles=[];
function buildParticles(){particles=[];const scale=Math.min(W,H)/34;for(let i=0;i<1850;i++){const a=Math.random()*Math.PI*2,d=Math.sqrt(Math.random())*Math.min(W,H)*.72;const p=heartPoint(Math.random()*Math.PI*2);particles.push({sx:W/2+Math.cos(a)*d,sy:H/2+Math.sin(a)*d,tx:W/2+p.x*scale,ty:H/2-p.y*scale,x:0,y:0,r:rnd(.45,2.35),tw:rnd(0,Math.PI*2),burst:rnd(.65,1.35)})}}
function seedDust(){const d=document.getElementById('dust');d.innerHTML='';for(let i=0;i<220;i++){const e=document.createElement('i');e.className='dust';e.style.left=rnd(0,100)+'%';e.style.top=rnd(0,100)+'%';e.style.opacity=rnd(.15,.6);e.style.transform=`scale(${rnd(.45,1.4)})`;d.appendChild(e)}}
function seedHearts(){hearts.innerHTML='';for(let i=0;i<48;i++){const e=document.createElement('span');e.className='float-heart';e.textContent=Math.random()>.45?'♥':'❤';e.style.left=rnd(-2,100)+'%';e.style.fontSize=rnd(11,29)+'px';e.style.animationDuration=rnd(8,16)+'s';e.style.animationDelay=rnd(-14,0)+'s';e.style.setProperty('--drift',rnd(-90,90)+'px');hearts.appendChild(e)}}
const pugAssets=['pug_big_left.png','pug_big_right.png','pug_medium.png','pug_small.png'];
let pugs=[];
function spawnPugs(){pugLayer.innerHTML='';pugs=[];for(let i=0;i<58;i++){const el=document.createElement('div');el.className='pug';const img=document.createElement('img');img.src='assets/'+pugAssets[i%pugAssets.length];el.appendChild(img);const depth=Math.random();const size=45+depth*165;el.style.width=size+'px';el.style.height=size+'px';const a=Math.random()*Math.PI*2,s=.16+depth*.68;const p={el,x:rnd(-160,W+100),y:rnd(-120,H+100),vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:rnd(-20,20),vr:rnd(-.18,.18),phase:rnd(0,Math.PI*2),scale:.72+depth*.48};el.style.left='0';el.style.top='0';pugs.push(p);pugLayer.appendChild(el);setTimeout(()=>el.classList.add('visible'),180+i*24)}}
function movePugs(now){for(const p of pugs){p.x+=p.vx;p.y+=p.vy+Math.sin(now*.00065+p.phase)*.035;p.rot+=p.vr;if(p.x<-170)p.x=W+80;if(p.x>W+90)p.x=-160;if(p.y<-150)p.y=H+70;if(p.y>H+80)p.y=-140;p.el.style.transform=`translate3d(${p.x}px,${p.y}px,0) rotate(${p.rot}deg) scale(${p.scale})`}}
let start=performance.now(),phase='forming';
function reset(){phase='forming';start=performance.now();textLayer.className='';pugLayer.className='';hearts.className='';flash.className='';pugLayer.innerHTML='';hearts.innerHTML='';pugs=[];buildParticles();seedDust()}
function loop(now){const t=(now-start)/1000;ctx.clearRect(0,0,W,H);for(const p of particles){if(t<3.45){const q=Math.min(1,t/3.2),e=1-(1-q)**4;p.x=p.sx+(p.tx-p.sx)*e;p.y=p.sy+(p.ty-p.sy)*e}else if(t<6.15){const pulse=1+Math.sin(t*4)*.026;p.x=W/2+(p.tx-W/2)*pulse;p.y=H/2+(p.ty-H/2)*pulse}else{const a=Math.atan2(p.ty-H/2,p.tx-W/2),dist=(t-6.15)*170*p.burst;p.x=p.tx+Math.cos(a)*dist;p.y=p.ty+Math.sin(a)*dist}const a=.42+.42*Math.sin(now*.004+p.tw);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,38,102,${a})`;ctx.shadowBlur=9;ctx.shadowColor='#ff174f';ctx.fill();ctx.shadowBlur=0}
if(t>3.55&&phase==='forming'){phase='text';textLayer.className='show'}
if(t>6.15&&phase==='text'){phase='burst';textLayer.className='hide';flash.className='burst';setTimeout(()=>{spawnPugs();pugLayer.className='on';hearts.className='on'},250)}
if(phase==='burst')movePugs(now);requestAnimationFrame(loop)}
seedHearts();reset();requestAnimationFrame(loop);
// Invisible restart: click anywhere after the finale. No visible extra button.
addEventListener('click',()=>{if(phase==='burst')reset()});
</script>
</body>
</html>
